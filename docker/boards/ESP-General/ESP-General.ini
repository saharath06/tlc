; PlatformIO Configuration for Bruce-S3 Pro Touch (ESP32-S3 N16R8)
; Supports: 2.8" ILI9341 Touch + 5 Buttons + CC1101 + nRF24 + PN532 + IR + GPS + BadUSB

[env:bruce-s3-pro-touch]
extends = env:esp32-s3-devkitc-1-psram
build_flags =
	${env:esp32-s3-devkitc-1-psram.build_flags}
	-DDEVICE_NAME='"Bruce-S3 Pro Touch"'

[env:esp32-s3-devkitc-1-psram]
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
extends = env:esp32-s3-devkitc-1
build_flags =
	${env:esp32-s3-devkitc-1.build_flags}
	-DBOARD_HAS_PSRAM=1

[env:esp32-s3-devkitc-1]
board = ESP-General
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${env.build_src_filter} +<../boards/ESP-General>
build_flags =
	${env.build_flags}
	-Iboards/ESP-General
	-DBOARD_HAS_PSRAM=1
	-DUSB_as_HID=1
	-DALLOW_ALL_GPIO_FOR_IR_RF=1
	-DUSE_HSPI_PORT=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DHAS_SCREEN=1
	-DHAS_TOUCH=1
	-DUSE_TFT_eSPI_TOUCH=1
	-DIR_TX_PINS='{{"IR TX (GPIO 4)", 4}, {"Grove SDA (8)", 8}, {"GPIO 17", 17}}'
	-DIR_RX_PINS='{{"IR RX (GPIO 5)", 5}, {"Grove SCL (9)", 9}, {"GPIO 18", 18}}'
	-DRF_TX_PINS='{{"CC1101 GDO0 (14)", 14}, {"GPIO 4", 4}, {"Grove SDA (8)", 8}}'
	-DRF_RX_PINS='{{"CC1101 GDO0 (14)", 14}, {"GPIO 5", 5}, {"Grove SCL (9)", 9}}'
	-DDEVICE_NAME='"Bruce-S3 Pro Touch"'

lib_deps =
	${env.lib_deps}
